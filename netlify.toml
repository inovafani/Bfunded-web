[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Netlify's official Next.js runtime. It detects the App Router build output and
# wires SSR/ISR routes to serverless functions automatically -- no static export.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
